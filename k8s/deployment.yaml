{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "session17-python"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "session17-python"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "session17-python"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "coursework-devsecops:lab",
            "ports": [
              {
                "containerPort": 5001
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "192Mi"
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 5001
              },
              "periodSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 5001
              },
              "periodSeconds": 10
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "imagePullPolicy": "IfNotPresent"
          }
        ]
      }
    }
  }
}
